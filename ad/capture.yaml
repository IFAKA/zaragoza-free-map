# Photographs "Zaragoza a mano" (the app one folder up): a build in .adkit/work, served by vite preview.
# Fixed place (Plaza del Pilar), fixed Madrid summer afternoon, fresh storage. The map tiles come from arcgisonline.com.
app:
  dir: ..
  isolate: copy
  setup: ['npm ci --no-audit --no-fund']
  build: ['npm run build']
  start: 'npx vite preview --port {port} --strictPort'
  ready: {path: /, timeoutSeconds: 120}

viewport: {width: 390, height: 844, scale: 3}
# A real phone's safe areas (status bar and home indicator), so the app lays out as on a device.
safeArea: {top: 47, bottom: 34}
# Live data answered with fixed files, so every capture is the same: a bus stop, the tram stops, Bizi.
routes:
  - {url: '**/hook*', file: capture/hook/page.html, contentType: text/html}
  - {url: '**/poste-autobus/*.json', file: capture/live/bus36.json}
  - {url: '**/poste-autobus/tuzsa-1099.json', file: capture/live/bus.json}
  - {url: '**/parada-tranvia/*.json', file: capture/live/tram.json}
  - {url: 'https://api.citybik.es/v2/networks/bizi', file: capture/live/bizi.json}
locale: es-ES
timezone: Europe/Madrid
clock: '2026-07-15T17:00:00+02:00'
geolocation: {latitude: 41.6563, longitude: -0.8790}
inputs: [capture]

sets:
  main:
    screens:
      # The hook: a plain, generic phone browser (capture/hook/page.html, served by a route).
      - name: hook-empty
        steps:
          - {goto: '/hook?v=empty&n=1'}
          - {wait: 700}
        settleMs: 400
        elements:
          field: {selector: '.pill', fixed: true}
          tabbtn: {selector: '.tabbtn', fixed: true}
      - name: hook-r1
        steps:
          - {goto: '/hook?v=results&q=fuente%20agua%20potable%20cerca&n=1'}
          - {wait: 700}
        settleMs: 400
        elements:
          tabbtn: {selector: '.tabbtn', fixed: true}
      - name: hook-r2
        steps:
          - {goto: '/hook?v=results&q=ba%C3%B1os%20p%C3%BAblicos%20zaragoza&n=4'}
          - {wait: 700}
        settleMs: 400
        elements:
          tabbtn: {selector: '.tabbtn', fixed: true}
      - name: hook-r3
        steps:
          - {goto: '/hook?v=results&q=refugio%20clim%C3%A1tico%20abierto&n=8'}
          - {wait: 700}
        settleMs: 400
        elements:
          tabbtn: {selector: '.tabbtn', fixed: true}
      - name: hook-r4
        steps:
          - {goto: '/hook?v=results&q=%C2%BFcu%C3%A1ndo%20pasa%20el%2035%3F&n=12'}
          - {wait: 700}
        settleMs: 400
        elements:
          tabbtn: {selector: '.tabbtn', fixed: true}
      - name: hook-tabs
        steps:
          - {goto: '/hook?v=tabs&n=12'}
          - {wait: 700}
        settleMs: 400
      # The same page with no pins.
      - name: map-bare
        steps:
          - {goto: /}
          - {evaluate: {file: capture/state.js}}
          - {goto: /}
          - {wait: {for: '[data-testid=nearest]', timeoutMs: 20000}}
          - {wait: 5000}
          - {evaluate: {file: capture/bare.js}}
          - {wait: 600}
        settleMs: 800
      # The water layer with 8 fountain pins around the user and the nearest card.
      - name: map
        steps:
          - {goto: /}
          - {evaluate: {file: capture/state.js}}
          - {goto: /}
          - {wait: {for: '[data-testid=nearest]', timeoutMs: 20000}}
          - {wait: 5000}
          - {evaluate: {file: capture/pins.js}}
          - {wait: 600}
        settleMs: 800
        elements:
          pin1: '#pin1'
          pin2: '#pin2'
          pin3: '#pin3'
          pin4: '#pin4'
          pin5: '#pin5'
          pin6: '#pin6'
          pin7: '#pin7'
          pin8: '#pin8'
          me: '.me'
          card: {selector: '[data-testid=nearest]', fixed: true}
          walkline: {selector: '#walkline', fixed: true}
          svcopen: {selector: '[data-testid=services-open]', fixed: true}
      # ONE continuous drawer: every screen below continues from the page state of the one before (no goto), and the real animation of
      # each action is filmed at 30 fps (the page fade and the drawer height ease of the app), so the video shows the app's own motion.
      - name: bus-svc
        steps:
          - {wait: 400}
          - {record: {click: '[data-testid=services-open]', elements: {svcopen: '[data-testid=services-open]'}, before: 5, frames: 20}}
          - {wait: 600}
        settleMs: 800
      - name: bus-tab
        steps:
          - {wait: 300}
          - {record: {click: '[data-testid=tab-bus]', elements: {tab: '[data-testid=tab-bus]'}, before: 5, frames: 30}}
          - {wait: 3000}
        settleMs: 800
      - name: bus-pin
        steps:
          - {wait: {for: '.mkw[title="Arquitecto La Figuera / Zalmedina"] .mk', timeoutMs: 20000}}
          - {wait: 500}
          - {record: {evaluate: capture/press.js, elements: {pin: '.mkw[title="Arquitecto La Figuera / Zalmedina"] .mk'}, before: 5, frames: 30}}
          - {wait: 2500}
        settleMs: 800
        elements:
          rows: {selector: '[data-testid=live-times]', fixed: true}
      - name: tram-svc
        steps:
          - {wait: 400}
          - {record: {click: '[data-testid=services-open]', elements: {svcopen: '[data-testid=services-open]'}, before: 5, frames: 20}}
          - {wait: 600}
        settleMs: 800
      - name: tram-tab
        steps:
          - {wait: 300}
          - {record: {click: '[data-testid=tab-tram]', elements: {tab: '[data-testid=tab-tram]'}, before: 5, frames: 30}}
          - {wait: 3000}
        settleMs: 800
      - name: tram-pin
        steps:
          - {wait: {for: '.mkw[title="Plaza del Pilar - Murallas"] .mk', timeoutMs: 20000}}
          - {wait: 500}
          - {record: {evaluate: capture/press.js, elements: {pin: '.mkw[title="Plaza del Pilar - Murallas"] .mk'}, before: 5, frames: 30}}
          - {wait: 2500}
        settleMs: 800
        elements:
          card: {selector: '[data-testid=nearest]', fixed: true}
      - name: bizi-svc
        steps:
          - {wait: 400}
          - {record: {click: '[data-testid=services-open]', elements: {svcopen: '[data-testid=services-open]'}, before: 5, frames: 20}}
          - {wait: 600}
        settleMs: 800
      - name: bizi-tab
        steps:
          - {wait: 300}
          - {record: {click: '[data-testid=tab-bizi]', elements: {tab: '[data-testid=tab-bizi]'}, before: 5, frames: 30}}
          - {wait: 3000}
        settleMs: 800
      - name: bizi-pin
        steps:
          - {wait: {for: '.mkw[title="9-Echegaray. Pte. Piedra"] .mk', timeoutMs: 20000}}
          - {wait: 500}
          - {record: {evaluate: capture/press.js, elements: {pin: '.mkw[title="9-Echegaray. Pte. Piedra"] .mk'}, before: 5, frames: 30}}
          - {wait: 2500}
        settleMs: 800
        elements:
          card: {selector: '[data-testid=nearest]', fixed: true}
      - name: m1-svc
        steps:
          - {wait: 400}
          - {record: {click: '[data-testid=services-open]', elements: {svcopen: '[data-testid=services-open]'}, before: 5, frames: 20}}
          - {wait: 600}
        settleMs: 800
      - name: m1-tab
        steps:
          - {wait: 300}
          - {record: {click: '[data-testid=tab-toilets]', elements: {tab: '[data-testid=tab-toilets]'}, before: 5, frames: 30}}
          - {wait: 3000}
        settleMs: 800
      - name: m2-svc
        steps:
          - {wait: 400}
          - {record: {click: '[data-testid=services-open]', elements: {svcopen: '[data-testid=services-open]'}, before: 5, frames: 20}}
          - {wait: 600}
        settleMs: 800
      - name: m2-tab
        steps:
          - {wait: 300}
          - {record: {click: '[data-testid=tab-wifi]', elements: {tab: '[data-testid=tab-wifi]'}, before: 5, frames: 30}}
          - {wait: 3000}
        settleMs: 800
      - name: m3-svc
        steps:
          - {wait: 400}
          - {record: {click: '[data-testid=services-open]', elements: {svcopen: '[data-testid=services-open]'}, before: 5, frames: 20}}
          - {wait: 600}
        settleMs: 800
      - name: m3-tab
        steps:
          - {wait: 300}
          - {record: {click: '[data-testid=tab-charge]', elements: {tab: '[data-testid=tab-charge]'}, before: 5, frames: 30}}
          - {wait: 3000}
        settleMs: 800
