          - {wait: {for: '[data-testid=nearest]', timeoutMs: 20000}}
          - {wait: 3500}
          - {click: '[data-testid=services-open]'}
          - {wait: 1200}
        settleMs: 800
        elements:
          tab-bus: {selector: '[data-testid=tab-bus]', fixed: true}
          tab-tram: {selector: '[data-testid=tab-tram]', fixed: true}
          tab-bizi: {selector: '[data-testid=tab-bizi]', fixed: true}
