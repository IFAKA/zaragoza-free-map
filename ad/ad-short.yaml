# yaml-language-server: $schema=/Users/faka/code/projects/adkit/schema/ad.schema.json
# SHORT CUT, 27 s, of the 43 s master (ad.yaml). 27 s vertical ad for "Zaragoza a mano" (independent city map PWA). Music 3/4 at 180 bpm: 1 beat = 10 frames, 1 bar = 1 s. Story (early November dusk): hook, charge, toilets, bus with the Av. Valencia detour, wifi, Bizi, end card; the whole app part is ONE take (take-short, never reset).
meta: {fps: 30, width: 1080, height: 1920, bars: 27}

brief:
  audience: People in Zaragoza on foot (locals, families, visitors) at dusk in November.
  message: "Lo que necesitas, cerca de ti: abres la app y lo más cercano ya está ahí, sin buscar."
  language: es-ES
  tone: warm, local, calm confidence. Not a tech demo.

brand:
  name: Zaragoza a mano
  tagline: Lo que necesitas, cerca de ti
  contact: "zaragoza-free-map.vercel.app"
  colors: {paper: "#FFFFFF", paperDeep: "#F1F1F0", ink: "#3C3C3B", glow: "#FFD9D4", accent: "#D92A22", night: "#262625"}
  fonts: {sans: Montserrat, serif: Montserrat, mark: Montserrat}
  icon: {text: Z, color: "#D92A22", textColor: "#FFFFFF", image: ../public/pwa-512.png}

capture: capture-short.yaml

scenes:
  - block: reveal
    bars: 0.6666666666666666
    screen: hook-empty
    open: rise
    camera:
      - {at: 0, zoom: 0.85, focus: {y: 422}, qy: 1050}
    titles:
      - {lines: ["Anochece.", "*El_móvil,_al_9_%.*"], at: 0, size: 100, y: 262, accent: "#D92A22", instant: true}

  # 19 beats: the search, two results pages, the tab overview, then the app opens.
  - block: tapFlow
    id: hook
    bars: 6.333333333333333
    start: {screen: hook-empty}
    titles:
      - {lines: ["Anochece.", "*El_móvil,_al_9_%.*"], at: 0, to: 6, size: 100, y: 262, accent: "#D92A22", instant: true}
      - {lines: ["Zaragoza", "*a_mano.*"], at: 13, size: 110, y: 262}
    steps:
      - {type: type, at: 0, element: field, text: "dónde cargo el móvil", beats: 2.5, fontSize: 19, color: "#202124"}
      - {type: screen, at: 3, screen: hook-r1, transition: fade}
      - {type: screen, at: 7, screen: hook-r2, transition: fade}
      - {type: tap, at: 10, element: tabbtn, radius: 22}
      - {type: screen, at: 10.5, screen: hook-tabs, transition: zoom}
      - {type: screen, at: 13, screen: map-bare, transition: zoom}
    camera:
      - {at: 0, zoom: 0.85, focus: {y: 422}, qy: 1050}

  # THE TAKE (take-short, 580 frames, take frame 0 = video frame 210): each block shows a range of it.
  # charge 0-120, toilets 120-220, bus 220-410, wifi + Bizi 410-490, end card 490-.
  - block: tapFlow
    id: near
    bars: 4
    start: {screen: take-short, transition: live, enter: fade}
    titles:
      - {lines: ["El cargador", "más *cercano.*"], at: 0, to: 8, size: 90, y: 262}
    steps:
      - {type: pulse, at: 3, element: me, count: 1}
    camera:
      - {at: 0, zoom: 0.85, focus: {y: 422}, qy: 1050}

  - block: tapFlow
    id: toilets
    bars: 3.3333333333333335
    start: {screen: take-short, transition: live}
    titles:
      - {lines: ["Un *aseo,*", "a_dos_minutos."], at: 0, to: 9, size: 90, y: 262}
    steps:
      - {type: tap, at: 1, element: s1, radius: 22}
      - {type: tap, at: 4, element: t1, radius: 22}
    camera:
      - {at: 0, zoom: 0.85, focus: {y: 422}, qy: 1050}

  - block: tapFlow
    id: bus
    bars: 6.333333333333333
    start: {screen: take-short, transition: live}
    titles:
      - {lines: ["Y el *bus,*", "en directo."], at: 0, to: 9, size: 90, y: 262}
      - {lines: ["Y el aviso", "de *obras.*"], at: 10.5, to: 18.5, size: 90, y: 262}
    steps:
      - {type: tap, at: 1, element: s2, radius: 22}
      - {type: tap, at: 4, element: t2, radius: 22}
    camera:
      - {at: 0, zoom: 0.85, focus: {y: 422}, qy: 1050}

  - block: tapFlow
    id: more
    bars: 2.6666666666666665
    start: {screen: take-short, transition: live}
    titles:
      - {lines: ["Wifi y", "*Bizi.*"], at: 1, to: 7, size: 90, y: 262}
    steps:
      - {type: tap, at: 0.5, element: s3, radius: 22}
      - {type: tap, at: 2.5, element: t3, radius: 22}
      - {type: tap, at: 4.5, element: s4, radius: 22}
      - {type: tap, at: 6.5, element: t4, radius: 22}
    camera:
      - {at: 0, zoom: 0.85, focus: {y: 422}, qy: 1050}

  - block: endCard
    bars: 3.6666666666666665
    screen: take-short
    mark: monogram
    title: {lines: ["Lo que necesitas,", "*cerca_de_ti.*"], at: 0, y: 560, size: 100}
    phone: {scale: 0.8, y: 410, x: 110}
    note: "Proyecto independiente. No oficial."
    lockupAt: 2.5
    contactAt: 4.5
    hitAt: 7

checks:
  # The app fades a page through (old out 80 ms, new in 150 ms); these are its own page swaps (tab, pin card, line page) where content change + drawer height easing still make a small spike. Re-list after each recapture.
  cuts: [374, 470, 474, 500, 540, 645, 649, 685, 689]

sound: sound-short.yaml

output: {file: out/zaragoza-a-mano-short.mp4, crf: 18}
