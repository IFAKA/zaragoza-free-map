# Zaragoza a mano: every sound is an object of the city or of a hot summer day on foot.
# Music: the approved jota (20 bars) (3/4 at 180 bpm): 3 tense bars with the cierzo, the tram bell on bar 4, the jota, a cadence on the tonic.
seed: 15
music: {file: music.json}

sounds:
  keyboard_tap:
    meaning: "A dry phone keyboard tap, one per search tab, because the pain is typing the same question again and again"
    layers:
      - {model: modal, preset: wood_block, note: A5, params: {decay: 0.03, hardness: 1, detune_cents: 30}, gain: -9}
      - {model: modal, preset: metal_bar, note: E7, params: {decay: 0.02, hardness: 1}, gain: -24}

  bell_echo:
    meaning: "A soft low echo of the tram bell down the street, the pulse of your own position on the map"
    tune: chord
    layers:
      - {model: modal, preset: tram_bell, note: D5, params: {decay: 1.2, velocity: 0.6, strike_pos: 0.3}, gain: -12}
    fx:
      - {type: lowpass, hz: 3200}
      - {type: delay, time: 0.2, feedback: 0.35, wet: 0.3}
      - {type: reverb, rt60: 0.9, wet: 0.18, damp_hz: 6000}

  water_pin:
    meaning: "A tuned drop of water, because each pin on the map is a drinking fountain"
    tune: chord
    layers:
      - {model: drop, note: A5, params: {rise: 1.6, damping: 0.6, plink: 0.4}, gain: -4}
      - {model: drop, note: E6, at: 0.1, params: {rise: 1.2, damping: 0.7, velocity: 0.6}, gain: -13}
    fx: [{type: reverb, rt60: 0.7, wet: 0.14, damp_hz: 8000}]

  glass_tap:
    meaning: "A fingertip tapping the glass of the phone, the light touch on a button of the app"
    layers:
      - {model: modal, preset: glass, note: C7, params: {decay: 0.05, hardness: 0.8}, gain: -12}
      - {model: modal, preset: wood_block, note: A4, params: {decay: 0.02, hardness: 0.6}, gain: -20}

  cool_air:
    meaning: "A cool breath from a fan in a climate shelter, the map switching to places with air conditioning"
    layers:
      - {model: wind, params: {dur: 0.7, strength: 0.5, gustiness: 0.2, centre: 1200, brightness: 0.3, whistle: 0.0}, gain: -9}
      - {model: whoosh, params: {dur: 0.5, f_start: 2400, f_end: 700, width: 1.0, shape: fall}, gain: -17}
    fx: [{type: widen, amount: 0.4}]

  cierzo_breath:
    meaning: "A short gust of the cierzo wind across the plaza, the map or the end card opening outdoors"
    layers:
      - {model: wind, params: {dur: 0.8, strength: 0.7, gustiness: 0.3, centre: 800, brightness: 0.5, whistle: 0.1}, gain: -10}
    fx: [{type: widen, amount: 0.3}]

  palma_flick:
    meaning: "A flick of castanets in time with the jota, the title lands like a dancer's finger snap"
    layers:
      - {model: sampler, params: {set: castanets, hit: strike, vel: 0.8}, gain: -6}
      - {model: sampler, params: {set: hands, hit: palma_sorda, vel: 0.5}, at: 0.0, gain: -12}
    fx: [{type: reverb, rt60: 0.5, wet: 0.08}]

  final_hit:
    meaning: "The tram bell with a castanet roll on the tonic, the last beat of the jota and the promise of the ad"
    tune: chord
    layers:
      - {model: modal, preset: tram_bell, note: D6, params: {decay: 2.4, strike_pos: 0.22}, gain: -5}
      - {model: castanets, at: 0.0, params: {velocity: 0.8, rattle: 3}, gain: -8}
    fx: [{type: reverb, rt60: 1.2, wet: 0.14, damp_hz: 9000}]

cues:
  type-tick: {sound: keyboard_tap, reason: "typing the search is the same dry keyboard tap"}
  drop: silent
  app-open: cierzo_breath
  pop-in: {sound: water_pin, variations: 4}
  skin-swap: {sound: water_pin, variations: 6, reason: "each service on the beat is one more drop, like the pins"}
  pulse: {sound: bell_echo, reason: "the blue dot answers with a soft echo of the bell"}
  tap: glass_tap
  screen-swap: cool_air
  title-in: palma_flick
  title-out: silent
  cut: silent
  cta-whoosh: {sound: cierzo_breath, gain: -2, reason: "the end card arrives with the same wind that opened the map"}
  lockup: {sound: palma_flick, gain: 1, reason: "the brand lands with the same castanet flick as the titles"}
  contact: silent
  final-hit: final_hit

mix:
  loudness: {lufs: -14, truePeak: -1.5}
  duckMusic: 1.5
