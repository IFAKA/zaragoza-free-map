# yaml-language-server: $schema=/Users/faka/code/projects/adkit/schema/ad.schema.json
# 15 s vertical ad for "Zaragoza a mano" (independent city map PWA). Music 3/4 at 180 bpm: 1 beat = 10 frames, 1 bar = 1 s.
meta: {fps: 30, width: 1080, height: 1920, bars: 20}

brief:
  audience: People in Zaragoza on foot (locals, families, visitors) in summer.
  message: "Lo que necesitas, cerca de ti: abres la app y lo más cercano ya está ahí, sin buscar."
  language: es-ES
  tone: warm, local, calm confidence. Not a tech demo.

brand:
  name: Zaragoza a mano
  tagline: Lo que necesitas, cerca de ti
  contact: "zaragoza-free-map.vercel.app"
  colors: {paper: "#FFFFFF", paperDeep: "#F1F1F0", ink: "#3C3C3B", glow: "#FFD9D4", accent: "#D92A22", night: "#262625"}
  fonts: {sans: Montserrat, serif: Montserrat, mark: Montserrat}
  icon: {text: Z, color: "#D92A22", textColor: "#FFFFFF", image: ../public/pwa-512.png}

capture: capture.yaml

scenes:
  # Bars 1-3: the pain, searching. Titles at the top, the tabs pile up below them.
  - block: chaos
    id: tabs
    bars: 3
    look: tabs
    size: 1.4
    pileTop: 700
    tile: {glyph: false}
    counter: {start: 3, rise: 36, cap: 40, label: "pestañas"}
    items:
      - {frame: -30, icon: "🚰", text: "fuente agua cerca"}
      - {frame: -20, icon: "🚻", text: "baños públicos"}
      - {beat: 0.5, icon: "🌳", text: "¿sombra?"}
      - {beat: 1, icon: "❄️", text: "refugio climático"}
      - {beat: 2, icon: "📶", text: "wifi gratis"}
      - {beat: 3, icon: "🚌", text: "¿cuándo pasa el 35?"}
      - {beat: 4, icon: "🚲", text: "bizi libres"}
      - {beat: 5, icon: "🚰", text: "fuente agua cerca"}
      - {beat: 6, icon: "🚻", text: "baños públicos"}
    into: icon
    flyBeats: 1
    title: {lines: ["Julio.", "*40_°C.*"], at: 0, to: 4.5, size: 130, y: 290, accent: "#FF6A5E", instant: true}
    titles:
      - {lines: ["¿Dónde hay", "*agua* cerca?"], at: 5, to: 7.5, size: 110, y: 290, accent: "#FF6A5E"}

  # Bar 4: the tram bell, the app icon.
  - block: iconOpen
    bars: 0.3333333333333333
    bloom: {core: "#F2554A", edge: "#7A1410"}

  # Bars 5-6: the map.
  - block: reveal
    bars: 2.6666666666666665
    screen: map-bare
    open: icon
    camera:
      - {at: 0, zoom: 0.85, focus: {y: 422}, qy: 1050}
    titles:
      - {lines: ["Zaragoza", "*a_mano.*"], at: 2, size: 90, y: 262}

  # Bars 7-9: the nearest fountain, one minute away.
  - block: tapFlow
    id: near
    bars: 3
    start: {screen: map}
    titles:
      - {lines: ["La más cercana,", "*primero.*"], at: 0, to: 2.5, size: 90, y: 262}
      - {lines: ["A un minuto,", "*a_pie.*"], at: 2.5, to: 4.5, size: 90, y: 262}
    steps:
      - {type: pop, at: 0.5, elements: [pin1, pin2, pin3, pin4, pin5, pin6, pin7, pin8], stagger: 0.5, style: pin, under: map-bare}
      - {type: pulse, at: 3.5, element: me, count: 1}
    camera:
      - {at: 0, zoom: 0.85, focus: {y: 422}, qy: 1050}
      - {at: 4.5, zoom: {fit: card, fraction: 0.88}, focus: {element: card}, qy: 1120, spring: fast}
      - {at: 8, zoom: 0.85, focus: {y: 422}, qy: 1050}

  # Bars 10-12: a bus stop, a line, the live minutes.
  - block: tapFlow
    id: bus
    bars: 3
    start: {screen: bus-stop}
    titles:
      - {lines: ["Y el *bus,*", "en directo."], at: 1, size: 90, y: 262}
    steps:
      - {type: tap, at: 3, element: chip, radius: 22, press: true}
      - {type: screen, at: 3.5, screen: bus-line, transition: fade}
    camera:
      - {at: 0, zoom: 0.85, focus: {y: 422}, qy: 1050}

  # Bars 13-14: the tram, then Bizi.
  - block: tapFlow
    id: tram
    bars: 1.3333333333333333
    start: {screen: tram}
    titles:
      - {lines: ["Tranvía y *Bizi.*"], at: 0, size: 90, y: 262}
    steps:
      - {type: screen, at: 2, screen: bizi, transition: cut}
    camera:
      - {at: 0, zoom: 0.85, focus: {y: 422}, qy: 1050}

  # Bars 14-16: one service on every beat.
  - block: skins
    id: montage
    bars: 2
    every: 1
    variants:
      - {screen: m-water}
      - {screen: m-toilets}
      - {screen: m-wifi}
      - {screen: m-charge}
      - {screen: m-libraries}
      - {screen: m-water}
    title: {lines: ["Todo, *cerca.*"], at: 0, size: 90, y: 262}
    camera:
      - {at: 0, zoom: 0.85, focus: {y: 422}, qy: 1050}

  # Bars 16-17: the climate shelters.
  - block: tapFlow
    id: shelter
    bars: 2
    start: {screen: shelter}
    titles:
      - {lines: ["Y refugios", "del *calor.*"], at: 0, size: 90, y: 262}
    steps:
      - {type: pop, at: 0.5, elements: [pin1, pin2, pin3, pin4], stagger: 0.5, style: pin, under: shelter-bare}
    camera:
      - {at: 0, zoom: 0.85, focus: {y: 422}, qy: 1050}

  # Bars 18-20.
  - block: endCard
    bars: 2.6666666666666665
    screen: map
    mark: monogram
    title: {lines: ["Lo que necesitas,", "*cerca_de_ti.*"], at: 0, y: 560, size: 100}
    phone: {scale: 0.8, y: 410, x: 110}
    note: "Proyecto independiente. No oficial."
    lockupAt: 2.5
    contactAt: 4
    hitAt: 6

sound: sound.yaml

output: {file: out/zaragoza-a-mano.mp4, crf: 18}
