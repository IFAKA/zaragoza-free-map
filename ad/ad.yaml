# yaml-language-server: $schema=/Users/faka/code/projects/adkit/schema/ad.schema.json
# 43 s vertical ad for "Zaragoza a mano" (independent city map PWA). Music 3/4 at 180 bpm: 1 beat = 10 frames, 1 bar = 1 s. Story: water, bus, tram+Bizi, montage, end card; the whole app part is ONE take (one page session, never reset); blocks only choose a time range of it.
meta: {fps: 30, width: 1080, height: 1920, bars: 43}

brief:
  audience: People in Zaragoza on foot (locals, families, visitors) in summer.
  message: "Lo que necesitas, cerca de ti: abres la app y lo más cercano ya está ahí, sin buscar."
  language: es-ES
  tone: warm, local, calm confidence. Not a tech demo.

brand:
  name: Zaragoza a mano
  tagline: Lo que necesitas, cerca de ti
  contact: "zaragoza-free-map.vercel.app"
  colors: {paper: "#FFFFFF", paperDeep: "#F1F1F0", ink: "#3C3C3B", glow: "#FFD9D4", accent: "#D92A22", night: "#262625"}
  fonts: {sans: Montserrat, serif: Montserrat, mark: Montserrat}
  icon: {text: Z, color: "#D92A22", textColor: "#FFFFFF", image: ../public/pwa-512.png}

capture: capture.yaml

scenes:
  # Every title stays long enough to read (4 words/s + 0.5 s + its entrance); the story is 129 beats = 43 bars = 43 s.
  - block: reveal
    bars: 0.6666666666666666
    screen: hook-empty
    open: rise
    camera:
      - {at: 0, zoom: 0.85, focus: {y: 422}, qy: 1050}
    titles:
      - {lines: ["Julio.", "*40_°C.*"], at: 0, size: 110, y: 262, accent: "#D92A22", instant: true}

  - block: tapFlow
    id: hook
    bars: 6.333333333333333
    start: {screen: hook-empty}
    titles:
      - {lines: ["Julio.", "*40_°C.*"], at: 0, to: 2.5, size: 110, y: 262, accent: "#D92A22", instant: true}
      - {lines: ["¿Dónde hay", "*agua* cerca?"], at: 4.5, to: 11, size: 110, y: 262}
      - {lines: ["Zaragoza", "*a_mano.*"], at: 13, size: 110, y: 262}
    steps:
      - {type: type, at: 0, element: field, text: "fuente agua potable cerca", beats: 2.5, fontSize: 19, color: "#202124"}
      - {type: screen, at: 3, screen: hook-r1, transition: fade}
      - {type: screen, at: 5, screen: hook-r2, transition: fade}
      - {type: screen, at: 7, screen: hook-r3, transition: fade}
      - {type: screen, at: 8.5, screen: hook-r4, transition: fade}
      - {type: tap, at: 10, element: tabbtn, radius: 22}
      - {type: screen, at: 10.5, screen: hook-tabs, transition: zoom}
      - {type: screen, at: 13, screen: map-bare, transition: zoom}
    camera:
      - {at: 0, zoom: 0.85, focus: {y: 422}, qy: 1050}

  # THE TAKE. From here to the end card the phone is one recording (capture.yaml, screen "take": 960 frames, one page session, nothing
  # reset). Each block below shows a time range of it; none has a cut, fade or still inside. A tap step sits on the frame of the action
  # it shows. Take frame = block start (frame 210 + ...) minus 210.
  # The nearest fountain, one minute away. The camera stays at the wide pose: the phone is readable. The map lives (blue dot, tiles).
  - block: tapFlow
    id: near
    bars: 5.666666666666667
    start: {screen: take, transition: live, enter: fade}
    titles:
      - {lines: ["La más cercana,", "*primero.*"], at: 0, to: 6.5, size: 90, y: 262}
      - {lines: ["A un minuto,", "*a_pie.*"], at: 8.5, to: 16, size: 90, y: 262}
    steps:
      - {type: pulse, at: 9, element: me, count: 1}
    camera:
      - {at: 0, zoom: 0.85, focus: {y: 422}, qy: 1050}

  # Services button, Bus tab, a stop on the map: three real taps, no cut. The only push-in reads the live minutes, holds 1.5 s, then pulls back.
  - block: tapFlow
    id: bus
    bars: 6
    start: {screen: take, transition: live}
    titles:
      - {lines: ["Y el *bus,*", "en directo."], at: 0, to: 11, size: 90, y: 262}
    steps:
      - {type: tap, at: 1.5, element: s1, radius: 22}
      - {type: tap, at: 5, element: t1, radius: 22}
      - {type: tap, at: 8.5, element: p1, radius: 22}
    camera:
      - {at: 0, zoom: 0.85, focus: {y: 422}, qy: 1050}
      - {at: 10.5, zoom: {fit: rows, fraction: 0.88}, focus: {y: 762}, qy: 1000, why: 'reads: "3 min"'}
      - {at: 16, zoom: 0.85, focus: {y: 422}, qy: 1050, spring: slow}

  # Tram, then Bizi: the same three taps, one block, one drawer.
  - block: tapFlow
    id: transport
    bars: 11.333333333333334
    start: {screen: take, transition: live}
    titles:
      - {lines: ["Tranvía", "y *Bizi.*"], at: 0, to: 16, size: 90, y: 262}
    steps:
      - {type: tap, at: 1.5, element: s2, radius: 22}
      - {type: tap, at: 5, element: t2, radius: 22}
      - {type: tap, at: 8.5, element: p2, radius: 22}
      - {type: tap, at: 17.5, element: s3, radius: 22}
      - {type: tap, at: 21, element: t3, radius: 22}
      - {type: tap, at: 24.5, element: p3, radius: 22}
    camera:
      - {at: 0, zoom: 0.85, focus: {y: 422}, qy: 1050}
      - {at: 10.5, zoom: {fit: cardt, fraction: 0.88}, focus: {y: 724}, qy: 1000, why: 'reads: "2 min"'}
      - {at: 16, zoom: 0.85, focus: {y: 422}, qy: 1050, spring: slow}
      - {at: 26.5, zoom: {fit: cardb, fraction: 0.78}, focus: {y: 738}, qy: 1000, why: 'reads: "7 bicis"'}
      - {at: 32, zoom: 0.85, focus: {y: 422}, qy: 1050, spring: slow}

  # One service after another, each one a tap on its tab. The end card follows at once.
  - block: tapFlow
    id: montage
    bars: 9
    start: {screen: take, transition: live}
    titles:
      - {lines: ["Todo, *cerca.*"], at: 0, to: 12, size: 90, y: 262}
    steps:
      - {type: tap, at: 1.5, element: s4, radius: 22}
      - {type: tap, at: 5, element: t4, radius: 22}
      - {type: tap, at: 10, element: s5, radius: 22}
      - {type: tap, at: 13.5, element: t5, radius: 22}
      - {type: tap, at: 18.5, element: s6, radius: 22}
      - {type: tap, at: 22, element: t6, radius: 22}
    camera:
      - {at: 0, zoom: 0.85, focus: {y: 422}, qy: 1050}

  - block: endCard
    bars: 4
    screen: take
    mark: monogram
    title: {lines: ["Lo que necesitas,", "*cerca_de_ti.*"], at: 0, y: 560, size: 100}
    phone: {scale: 0.8, y: 410, x: 110}
    note: "Proyecto independiente. No oficial."
    lockupAt: 2.5
    contactAt: 4.5
    hitAt: 7

checks:
  # The 8 video frames where the app itself swaps a whole drawer page in one frame (the old page vanishes at once, the new one fades in
  # from 0; real 16 ms in the app, 33 ms here): the first frame of the six tab taps (430, 610, 770, 950, 1035, 1120), of the bus stop tap
  # (465, the card becomes the live times) and of the 4th services tap (915). Everything else in the take flows. Removing them needs a cross-fade in the app (PagedDrawer), not in the ad.
  cuts: [430, 465, 610, 770, 915, 950, 1035, 1120]

sound: sound.yaml

output: {file: out/zaragoza-a-mano.mp4, crf: 18}
