# yaml-language-server: $schema=/Users/faka/code/projects/adkit/schema/ad.schema.json
# 35 s vertical ad for "Zaragoza a mano" (independent city map PWA). Music 3/4 at 180 bpm: 1 beat = 10 frames, 1 bar = 1 s.
meta: {fps: 30, width: 1080, height: 1920, bars: 35}

brief:
  audience: People in Zaragoza on foot (locals, families, visitors) in summer.
  message: "Lo que necesitas, cerca de ti: abres la app y lo más cercano ya está ahí, sin buscar."
  language: es-ES
  tone: warm, local, calm confidence. Not a tech demo.

brand:
  name: Zaragoza a mano
  tagline: Lo que necesitas, cerca de ti
  contact: "zaragoza-free-map.vercel.app"
  colors: {paper: "#FFFFFF", paperDeep: "#F1F1F0", ink: "#3C3C3B", glow: "#FFD9D4", accent: "#D92A22", night: "#262625"}
  fonts: {sans: Montserrat, serif: Montserrat, mark: Montserrat}
  icon: {text: Z, color: "#D92A22", textColor: "#FFFFFF", image: ../public/pwa-512.png}

capture: capture.yaml

scenes:
  # Beats 0-20: the pain on a plain phone browser (searching, tab after tab), then the app opens.
  # Every title stays long enough to read (4 words/s + 0.5 s + its entrance); the story is 105 beats = 35 bars = 35 s.
  - block: reveal
    bars: 0.6666666666666666
    screen: hook-empty
    open: rise
    camera:
      - {at: 0, zoom: 0.85, focus: {y: 422}, qy: 1050}
    titles:
      - {lines: ["Julio.", "*40_°C.*"], at: 0, size: 110, y: 262, accent: "#D92A22", instant: true}

  - block: tapFlow
    id: hook
    bars: 6.333333333333333
    start: {screen: hook-empty}
    titles:
      - {lines: ["Julio.", "*40_°C.*"], at: 0, to: 2.5, size: 110, y: 262, accent: "#D92A22", instant: true}
      - {lines: ["¿Dónde hay", "*agua* cerca?"], at: 4.5, to: 11, size: 110, y: 262}
      - {lines: ["Zaragoza", "*a_mano.*"], at: 13, size: 110, y: 262}
    steps:
      - {type: type, at: 0, element: field, text: "fuente agua potable cerca", beats: 2.5, fontSize: 19, color: "#202124"}
      - {type: screen, at: 3, screen: hook-r1, transition: fade}
      - {type: screen, at: 5, screen: hook-r2, transition: fade}
      - {type: screen, at: 7, screen: hook-r3, transition: fade}
      - {type: screen, at: 8.5, screen: hook-r4, transition: fade}
      - {type: tap, at: 10, element: tabbtn, radius: 22}
      - {type: screen, at: 10.5, screen: hook-tabs, transition: zoom}
      - {type: screen, at: 13, screen: map-bare, transition: zoom}
    camera:
      - {at: 0, zoom: 0.85, focus: {y: 422}, qy: 1050}

  # Beats 20-38: the nearest fountain, one minute away. The card holds still after the push-in.
  - block: tapFlow
    id: near
    bars: 7
    start: {screen: map}
    titles:
      - {lines: ["La más cercana,", "*primero.*"], at: 0, to: 6.5, size: 90, y: 262}
      - {lines: ["A un minuto,", "*a_pie.*"], at: 8.5, to: 16, size: 90, y: 262}
    steps:
      - {type: pop, at: 0.5, elements: [pin1, pin2, pin3, pin4, pin5, pin6, pin7, pin8], stagger: 0.5, style: pin, under: map-bare}
      - {type: pulse, at: 9, element: me, count: 1}
    camera:
      - {at: 0, zoom: 0.85, focus: {y: 422}, qy: 1050}
      - {at: 15.5, zoom: {fit: card, fraction: 0.88}, focus: {element: card}, qy: 1120}

  # Beats 38-54: a bus stop, a line, the live minutes.
  - block: tapFlow
    id: bus
    bars: 5.666666666666667
    start: {screen: bus-stop}
    titles:
      - {lines: ["Y el *bus,*", "en directo."], at: 0, to: 7.5, size: 90, y: 262}
    steps:
      - {type: tap, at: 10.5, element: chip, radius: 22, press: true}
      - {type: screen, at: 11, screen: bus-line, transition: fade}
    camera:
      - {at: 0, zoom: 0.85, focus: {y: 422}, qy: 1050, spring: slow}
      - {at: 5, zoom: {fit: rows, fraction: 0.88}, focus: {y: 330}, qy: 1000}
      - {at: 11, zoom: {fit: steps, fraction: 0.88}, focus: {y: 590}, qy: 1000, spring: slow}

  # Beats 54-67: the tram, then Bizi, each with its own close-up.
  - block: tapFlow
    id: tram
    bars: 5.666666666666667
    start: {screen: tram}
    titles:
      - {lines: ["Tranvía y *Bizi.*"], at: 0, to: 5.5, size: 90, y: 262}
    steps:
      - {type: screen, at: 11, screen: bizi, transition: fade}
    camera:
      - {at: 0, zoom: 0.85, focus: {y: 422}, qy: 1050}
      - {at: 5.5, zoom: {fit: card, fraction: 0.88}, focus: {y: 267}, qy: 1000}
      - {at: 11, zoom: {fit: card, fraction: 0.88}, focus: {y: 738}, qy: 1000, spring: slow}

  # One service on every beat.
  - block: skins
    id: montage
    bars: 1.6666666666666667
    every: 1
    variants:
      - {screen: m-water}
      - {screen: m-toilets}
      - {screen: m-wifi}
      - {screen: m-charge}
      - {screen: m-libraries}
    title: {lines: ["Todo, *cerca.*"], at: 0, size: 90, y: 262}
    camera:
      - {at: 0, zoom: 0.85, focus: {y: 422}, qy: 1050, spring: slow}

  # Beats 72-85: the climate shelters: pins pop, then the card.
  - block: tapFlow
    id: shelter
    bars: 4.333333333333333
    start: {screen: shelter}
    titles:
      - {lines: ["Y refugios", "del *calor.*"], at: 0, to: 6.5, size: 90, y: 262}
    steps:
      - {type: pop, at: 0.5, elements: [pin1, pin2, pin3, pin4], stagger: 0.5, style: pin, under: shelter-bare}
    camera:
      - {at: 0, zoom: 0.85, focus: {y: 422}, qy: 1050}
      - {at: 6.5, zoom: {fit: card, fraction: 0.88}, focus: {y: 727}, qy: 1000}

  # Beats 85-96.
  - block: endCard
    bars: 3.6666666666666665
    screen: map
    mark: monogram
    title: {lines: ["Lo que necesitas,", "*cerca_de_ti.*"], at: 0, y: 560, size: 100}
    phone: {scale: 0.8, y: 410, x: 110}
    note: "Proyecto independiente. No oficial."
    lockupAt: 2.5
    contactAt: 4.5
    hitAt: 7

checks:
  cuts: []

sound: sound.yaml

output: {file: out/zaragoza-a-mano.mp4, crf: 18}
