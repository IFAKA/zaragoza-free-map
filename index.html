<style>
/* First paint before any script: the map colour and an empty sheet, so the page is not white while the code loads. React replaces it. */
html,body{margin:0;height:100%;background:#E9EAEA}
#shell{position:fixed;inset:0;background:#E9EAEA}
#shell i{position:absolute;left:0;right:0;bottom:0;height:min(360px,45%);background:#fff;border-radius:16px 16px 0 0;box-shadow:0 -2px 12px rgb(0 0 0/.12)}
#shell i:before{content:"";position:absolute;left:50%;top:8px;width:36px;height:4px;margin-left:-18px;border-radius:2px;background:#909091}
@media (prefers-color-scheme:dark){html,body,#shell{background:#1E2022}#shell i{background:#2A2C2E}}
</style>
<div id="root"><div id="shell"><i></i></div></div>
